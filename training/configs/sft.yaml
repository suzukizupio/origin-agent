schema_version: 2
model_name: Origin-Coder-v1-experiment
base_model_path: training/models/base-qwen-coder-0.5b
dataset:
  train: training/data/sft/practice-train.jsonl
  validation: training/data/validation/practice-validation.jsonl
  holdout_allowed: false
  representation: provider_messages
training:
  device: cpu
  cpu_threads: 4
  max_steps: 16
  learning_rate: 0.001
  seed: 42
  max_sequence_length: 4096
  validation_examples: 2
  gradient_checkpointing: true
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, v_proj]
output_dir: training/models/Origin-Coder-v1-experiment
